# This file contains the configuration for the lab instruments used in the project.

# Second power supply for the board supplies
power_supply_pcb:
  name: "KeySight E36312A PS - Board"
  IP: "10.91.16.95"
  channels:
    -
      name: "CH1" # 5V
      voltage: 5.0
      current: 1.0
    -
      name: "CH2" # 9V
      voltage: 9.0
      current: 0.5
    -
      name: "CH3" # 3V
      voltage: 3.0
      current: 0.5

power_analyzer_chip:
  name: "Keysight N6705B Power Analyzer"
  IP: "10.91.16.33"
  channels:
    -
      name: "CH1" # VDDIO
      voltage: 1.8
      current: 1.0
    -
      name: "CH2" # VDDA GALENA 1
      voltage: 0.75
      current: 1.0
    -
      name: "CH3" # VDD CORE
      voltage: 0.75
      current: 1.0
    -
      name: "CH4" # VDD GALENA 2 + PLL
      voltage: 0.75
      current: 1.0

# Independent single-channel B2901BL SMUs for analog calibration.  These
# values are the defaults consumed by sw.tests.smu_control; an output still
# requires the command line's explicit --enable flag.
source_measure_units:
  smu_1:
    name: "Keysight B2901BL SMU 1 - Analog Calibration"
    IP: "10.91.16.78"
    mode: "current"
    current: 0.00005 # 50 uA
    voltage_limit: 0.75
  smu_2:
    name: "Keysight B2901BL SMU 2 - Analog Calibration"
    IP: "10.91.16.77"
    mode: "current"
    current: 0.00005 # 50 uA
    voltage_limit: 0.75
  smu_3:
    name: "Keysight B2901BL SMU 3 - Analog Calibration"
    IP: "10.91.16.79"
    mode: "current"
    current: 0.00005 # 50 uA
    voltage_limit: 0.75
