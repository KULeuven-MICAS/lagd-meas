# This file contains the configuration for the lab instruments used in the project.

# Second power supply for the board supplies
power_supply_pcb:
  name: "KeySight E36312A PS - Board"
  IP: "10.91.16.95"
  channels:
    -
      name: "CH1" # 5V
      voltage: 5.0
      current: 1.0
    -
      name: "CH2" # 9V
      voltage: 9.0
      current: 0.5
    -
      name: "CH3" # 3V
      voltage: 3.0
      current: 0.5

power_analyzer_chip:
  name: "Keysight N6705B Power Analyzer"
  IP: "10.91.16.33"
  channels:
    -
      name: "CH1" # VDDIO
      voltage: 1.8
      current: 1.0
    -
      name: "CH2" # VDDA GALENA 1
      voltage: 0.75
      current: 1.0
    -
      name: "CH3" # VDD CORE
      voltage: 0.75
      current: 1.0
    -
      name: "CH4" # VDD GALENA 2 + PLL
      voltage: 0.75
      current: 1.0

# Source meter supplying the PLL (VDD 0.75 V) and measuring its current consumption (sw/tests/psu_test.py)
smu_vdd_pll:
  name: "Keithley 2450 SMU - PLL VDD"
  IP: "10.91.16.9"
  args:
    v_min: 0.0
    v_max: 0.75 # PLL VDD, never above it
    i_limit: 0.05 # current compliance [A]
    i_range: 0.1 # fixed measure range [A]; lower it (e.g. 0.01) once the PLL current is known, for resolution
    terminals: "FRON"
    remote_sense: false

# Triple supply for the PLL measurements (sw/tests/psu_test.py); voltage [V], current limit [A] per channel
power_supply_pll:
  name: "KeySight E36312A PS - PLL"
  IP: "10.91.16.86"
  channels:
    -
      name: "CH1"
      voltage: 5.0
      current: 0.1
    -
      name: "CH2"
      voltage: 0.75
      current: 0.01
    -
      name: "CH3" # PLL supply: current and power logged per configuration
      voltage: 0.75
      current: 0.2

# Waveform generator, test clocks / reference for the PLL
function_generator:
  name: "Keysight 33600A FG"
  IP: "10.91.16.6"
  args:
    channels: 2

# Source meter driving the external VCO control voltage (Vctrl pad)
smu_vctrl:
  name: "Keithley 2450 SMU - Vctrl"
  IP: "10.91.16.51"
  args:
    v_min: 0.0
    v_max: 0.75 # PLL VDD, never drive Vctrl above it
    i_limit: 10.0e-6 # Vctrl is a gate: any real current means a fault
    i_range: 10.0e-6 # fixed measure range, see the driver docstring
    terminals: "FRON"
    remote_sense: false

# Oscilloscope measuring the (divided) PLL/VCO output clock
scope:
  name: "R&S RTB2004 Scope"
  IP: "10.91.16.37"
  args:
    channels: 4

spectrum_analyzer:
  name: "Rohde & Schwarz FSV Signal Analyzer"
  IP: "10.91.16.56"

