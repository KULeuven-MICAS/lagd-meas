# This file contains the configuration for the lab instruments used in the project.

# Second power supply for the board supplies
power_supply_pcb:
  name: "KeySight E36312A PS - Board"
  IP: "10.91.16.95"
  channels:
    -
      name: "5V"
      channel: "CH1"
      voltage: 5.0
      current: 1.0
      priority: 1
    -
      name: "9V"
      channel: "CH2"
      voltage: 9.0
      current: 0.5
      priority: 2
    -
      name: "m3V"
      channel: "CH3"
      voltage: 3.0
      current: 0.5
      priority: 2

power_analyzer_chip:
  name: "Keysight N6705B Power Analyzer"
  IP: "10.91.16.33"
  channels:
    -
      name: "VDDIO"
      channel: "CH1"
      voltage: 1.8
      current: 1.0
      priority: 1
    -
      name: "VDDA GALENA 1"
      channel: "CH2"
      voltage: 0.75
      current: 1.0
      priority: 3
    -
      name: "VDD CORE"
      channel: "CH3"
      voltage: 0.75
      current: 1.0
      priority: 2
    -
      name: "VDDA GALENA 2 + PLL"
      channel: "CH4"
      voltage: 0.75
      current: 1.0
      priority: 3
