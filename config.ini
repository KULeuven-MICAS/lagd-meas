#
# Shared lab defaults. This file is tracked by git.
#
# Do NOT edit it to point at your own workspace. Instead, once per user:
#
#     cp config.ini config.local.ini
#
# and edit config.local.ini (gitignored), keeping only the lines you change.
# See lab_config.py for how the two files are merged.

# The measurement server the chip's UART is attached to.
[measurement-host]
host = root@00.00.00.00
# Where this repo is checked out / mounted on that server. Per user -- override me.
remote_dir = Workspace/workspace
device = /dev/ttyUSB2
python = /usr/local/localenv/python3.6/bin/python3

# The ZCU102 board that carries the FPGA bitstream.
[zcu102]
host = xilinx@00.00.00.00
remote_dir = jupyter_notebooks/lagd_v1_2026
