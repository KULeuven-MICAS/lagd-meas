# Post-processing environment (plots, notebooks) for the workstation, managed by
# uv: `uv sync`. The measurement code itself runs on the lab machines' Python 3.6
# (pyvisa-env) and does not use this environment.
[project]
name = "lagd-meas"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jupyter",
    "kaleido",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
]

[tool.uv]
package = false  # not an installable package, only an environment

[tool.ruff]
line-length = 120
indent-width = 4
cache-dir = ".cache/ruff"
# Code must run on Python 3.6 (lab measurement machines). py37 is the lowest
# target ruff supports; it keeps annotation lints (list[int], X | Y, etc.) from
# suggesting syntax that fails at runtime on old interpreters.
target-version = "py37"

[tool.ruff.lint]
select = ["F", "E", "W", "UP", "TID252", "A", "PTH", "PLC", "PLE"]
ignore = ["PT", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]
# pll_settings is a bag of PLL config constants; the tests star-import it so the
# constants are all available in interactive `python -i` debug sessions.
"sw/tests/chip_test.py" = ["F403", "F405"]
"sw/tests/pll_test.py" = ["F403", "F405"]

[tool.pylint.MASTER]
# Files or directories to skip
ignore = ["fpga/"]
